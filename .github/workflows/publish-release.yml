name: Publish Release

on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build workflow run ID from private repo'
        required: true
      version:
        description: 'Release version/tag'
        required: true
        default: 'v2.5.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          COMMITS=""

          # 方案1: 从私有仓库获取提交记录（优先，因为私有仓库有完整源码提交历史）
          echo "[changelog] Fetching commits from private repo for version: $VERSION"

          # 先尝试获取上一个 release tag，用 compare API 只取版本间的 commits
          PREVIOUS_TAG=$(gh api repos/jackyhwei/xiaomate-desktop/releases/latest --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$VERSION" ]; then
            echo "[changelog] Previous release tag: $PREVIOUS_TAG. Using compare API for range commits."
            GH_OUTPUT=$(gh api "repos/jackyhwei/xiaomate-desktop/compare/${PREVIOUS_TAG}...${VERSION}" --paginate 2>/tmp/gh_err || true)
          else
            echo "[changelog] No previous release found or same as current. Fetching last 30 commits."
            GH_OUTPUT=$(gh api "repos/jackyhwei/xiaomate-desktop/commits?sha=${VERSION}&per_page=30" 2>/tmp/gh_err || true)
          fi

          if [ -n "$GH_OUTPUT" ]; then
            echo "[changelog] GH API returned ${#GH_OUTPUT} chars"
            echo "[changelog] First 300 chars of response: $(echo "$GH_OUTPUT" | head -c 300)"
            echo "" | base64 -d > /tmp/extract_commits.py
            PRIVATE_COMMITS=$(echo "$GH_OUTPUT" | python3 /tmp/extract_commits.py 2>/tmp/py_err)
            if [ -n "$PRIVATE_COMMITS" ] && ! echo "$PRIVATE_COMMITS" | grep -q "^PYTHON_ERROR:"; then
              COMMITS="$PRIVATE_COMMITS"
              echo "[changelog] Changelog generated from private repo commits"
            else
              echo "[changelog] Python processing failed or returned empty. stderr:"
              cat /tmp/py_err 2>/dev/null || true
            fi
          else
            echo "[changelog] GH API returned empty. stderr:"
            cat /tmp/gh_err 2>/dev/null || true
          fi

          # 方案2: 如果私有仓库获取失败，尝试从本地公开仓库生成
          if [ -z "$COMMITS" ]; then
            if git rev-parse --verify "$VERSION" >/dev/null 2>&1; then
              PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
              if [ -z "$PREVIOUS_TAG" ]; then
                COMMITS=$(git log --pretty=format:"- %s" "${VERSION}" 2>/dev/null || echo "")
              else
                COMMITS=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${VERSION}" 2>/dev/null || echo "")
              fi
              echo "[changelog] Changelog generated from local git history"
            fi
          fi

          # 兜底: 如果都没有获取到，给一个占位提示
          if [ -z "$COMMITS" ]; then
            COMMITS="- Release $VERSION"
            echo "[changelog] No detailed changelog available for $VERSION"
          fi

          {
            echo "commits<<EOF"
            echo "## Commits"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Download artifacts from private repo
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repo: jackyhwei/xiaomate-desktop
          workflow: release.yml
          run_id: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
          path: artifacts
          skip_unpack: false

      - name: Delete existing release if present
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          gh release delete "$VERSION" --repo "${{ github.repository }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.commits }}
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
