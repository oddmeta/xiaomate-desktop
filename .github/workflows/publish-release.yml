name: Publish Release

on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build workflow run ID from private repo'
        required: true
      version:
        description: 'Release version/tag'
        required: true
        default: 'v2.5.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "${VERSION}")
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${VERSION}")
          fi
          {
            echo "commits<<EOF"
            echo "## Commits"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts from private repo
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repo: jackyhwei/xiaomate-desktop
          workflow: release.yml
          run_id: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
          path: artifacts
          skip_unpack: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.commits }}
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
