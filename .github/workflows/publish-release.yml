name: Publish Release

on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build workflow run ID from private repo'
        required: true
      version:
        description: 'Release version/tag'
        required: true
        default: 'v2.5.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts from private repo
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repo: jackyhwei/xiaomate-desktop
          workflow: release.yml
          run_id: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
          path: artifacts
          skip_unpack: false

      - name: Read changelog from artifacts
        id: changelog
        run: |
          CHANGELOG_FILE=""
          for dir in artifacts/windows-artifacts artifacts/macos-artifacts artifacts/linux-artifacts; do
            if [ -f "$dir/changelog.txt" ]; then
              CHANGELOG_FILE="$dir/changelog.txt"
              break
            fi
          done
          if [ -n "$CHANGELOG_FILE" ]; then
            COMMITS=$(cat "$CHANGELOG_FILE")
            echo "Changelog read from artifact"
          else
            COMMITS="- Release ${{ github.event.client_payload.version || github.event.inputs.version }}"
            echo "No changelog.txt found in artifacts, using fallback"
          fi
          {
            echo "commits<<EOF"
            echo "## Commits"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing release if present
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          gh release delete "$VERSION" --repo "${{ github.repository }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.commits }}
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
